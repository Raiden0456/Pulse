services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: pulse
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: pulse
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
    restart: unless-stopped

  app:
    build: .
    image: pulse:latest
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
        restart: true
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google.json
    volumes:
      - data:/data
      - ./secrets/google.json:/secrets/google.json:ro
    restart: unless-stopped

volumes:
  ts-state:
  data:
